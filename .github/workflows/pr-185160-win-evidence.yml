name: PR 185160 Windows Updater Evidence

on:
  push:
    branches: ["evidence/pr-185160-windows"]
  workflow_dispatch:

jobs:
  windows-real-updater-evidence:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-env
        with:
          node-version: "26.12.1"
          install-bun: "false"
      - name: Write evidence script
        shell: bash
        run: |
          mkdir -p .tmp-evidence
          printf '%s' '' | base64 -d > .tmp-evidence/real-updater-evidence.mts
          wc -c .tmp-evidence/real-updater-evidence.mts
      - name: Run real-driver evidence
        shell: bash
        run: node --import ./scripts/tsx.mjs .tmp-evidence/real-updater-evidence.mts
