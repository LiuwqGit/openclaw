name: Installed-app proof captures (PR 171331)

# 一次性证据采集工作流（fork 专用，不属于 PR diff）：
# 在带 KVM 的 hosted runner 上构建 before/after 两个 APK，
# 安装到真实 Android 模拟器（installed-app 执行），连接本地 openclaw gateway，
# 驱动 UI 采集 Health / Dreaming before/after 截图（含 fr + 2x 字体 + 320dp 窄屏用例）。

on:
  workflow_dispatch:
  push:
    branches: [ci/installed-app-proof-171331]

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Ensure Android SDK components
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=${ANDROID_HOME}"
          SDKM="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -d "${ANDROID_HOME}/system-images/android-36/google_apis/x86_64" ]; then
            "$SDKM" --install "system-images;android-36;google_apis;x86_64" >/dev/null
          fi
          if [ ! -x "${ANDROID_HOME}/emulator/emulator" ]; then
            "$SDKM" --install "emulator" >/dev/null
          fi
          ls "${ANDROID_HOME}/system-images/android-36/google_apis/"
          test -x "${ANDROID_HOME}/emulator/emulator"

      - name: Setup pnpm
        run: npm install -g pnpm@12.3.4

      - name: Install mermaid renderer dependencies (gradle preBuild needs them)
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile --prefer-offline --optional \
            --filter '@openclaw/mermaid-renderer...' \
            --filter '@openclaw/gateway-protocol...'

      - name: Checkout upstream main (BEFORE baseline source)
        uses: actions/checkout@v4
        with:
          repository: openclaw/openclaw
          ref: main
          path: upstream-main
          fetch-depth: 1

      - name: Build AFTER apk (PR head)
        run: |
          set -euo pipefail
          cd apps/android
          ./gradlew :app:assemblePlayDebug --console=plain
          mkdir -p "${GITHUB_WORKSPACE}/proof-out"
          cp app/build/outputs/apk/play/debug/*-play-debug.apk "${GITHUB_WORKSPACE}/proof-out/after-head.apk"

      - name: Build BEFORE apk (upstream main row padding)
        run: |
          set -euo pipefail
          SRC="upstream-main/apps/android/app/src/main/java/ai/openclaw/app/ui/design/ClawComponents.kt"
          DST="apps/android/app/src/main/java/ai/openclaw/app/ui/design/ClawComponents.kt"
          test -f "$SRC"
          if grep -q 'padding(horizontal = 10.dp, vertical = 6.dp)' "$SRC"; then
            echo "upstream main already carries the fix; BEFORE baseline invalid" >&2
            exit 2
          fi
          cp "$SRC" "$DST"
          cd apps/android
          ./gradlew :app:assemblePlayDebug --console=plain
          cp app/build/outputs/apk/play/debug/*-play-debug.apk "${GITHUB_WORKSPACE}/proof-out/before-main.apk"
          cd "${GITHUB_WORKSPACE}"
          git checkout HEAD -- "$DST"
          git status --short

      - name: Install openclaw CLI (gateway for pairing)
        run: |
          set -euo pipefail
          npm install -g openclaw@2026.10.3
          openclaw --version

      - name: Start local gateway
        run: |
          set -euo pipefail
          export OPENCLAW_STATE_DIR="${RUNNER_TEMP}/oc-state"
          mkdir -p "$OPENCLAW_STATE_DIR"
          PROOF_TOKEN="$(openssl rand -hex 24)"
          echo "$PROOF_TOKEN" > "${RUNNER_TEMP}/gateway-token.txt"
          openclaw config set gateway.auth.mode token
          openclaw config set gateway.auth.token "$PROOF_TOKEN"
          nohup openclaw gateway --port 18790 --allow-unconfigured > "${RUNNER_TEMP}/gateway.log" 2>&1 &
          READY=0
          for i in $(seq 1 90); do
            if curl -fsS -o /dev/null http://127.0.0.1:18790/ 2>/dev/null; then READY=1; break; fi
            sleep 2
          done
          if [ "$READY" != "1" ]; then
            echo "gateway never became reachable" >&2
            tail -20 "${RUNNER_TEMP}/gateway.log" >&2
            exit 1
          fi
          echo "gateway http reachable"
          tail -5 "${RUNNER_TEMP}/gateway.log"

      - name: Create and boot emulator
        run: |
          set -euo pipefail
          export PATH="${ANDROID_HOME}/platform-tools:${ANDROID_HOME}/emulator:${ANDROID_HOME}/cmdline-tools/latest/bin:$PATH"
          sudo chmod 666 /dev/kvm || true
          ls -la /dev/kvm
          mkdir -p "${GITHUB_WORKSPACE}/proof-out/diagnostics"
          DBG="${GITHUB_WORKSPACE}/proof-out/diagnostics/emulator-setup.log"
          {
            echo "=== /dev/kvm ==="
            ls -la /dev/kvm || true
            echo "=== env ==="
            echo "HOME=$HOME AVD_HOME=${ANDROID_AVD_HOME:-unset} SDK_HOME=${ANDROID_SDK_HOME:-unset} ANDROID_HOME=$ANDROID_HOME"
            echo "=== avdmanager attempt ==="
            echo no | avdmanager create avd --force --name proof_api36 --package "system-images;android-36;google_apis;x86_64" --device pixel_2 || echo "avdmanager rc=$?"
          } > "$DBG" 2>&1 || true

          AVD_DIR="$HOME/.android/avd/proof_api36.avd"
          INI="$HOME/.android/avd/proof_api36.ini"
          mkdir -p "$AVD_DIR"
          if [ ! -f "$INI" ]; then
            printf 'avd.ini.encoding=UTF-8\npath=%s\npath.rel=avd/proof_api36.avd\ntarget=android-36\n' "$AVD_DIR" > "$INI"
          fi
          if [ ! -f "$AVD_DIR/config.ini" ]; then
            cat > "$AVD_DIR/config.ini" <<'AVDINI'
          avd.ini.encoding=UTF-8
          AvdId=proof_api36
          tag.display=Google APIs
          tag.id=google_apis
          abi.type=x86_64
          disk.dataPartition.size=6G
          hw.audioInput=yes
          hw.cpu.arch=x86_64
          hw.cpu.ncore=2
          hw.device.name=pixel_2
          hw.gpu.enabled=yes
          hw.gpu.mode=swiftshader_indirect
          hw.keyboard=yes
          hw.lcd.density=420
          hw.lcd.height=1920
          hw.lcd.width=1080
          hw.ramSize=3072
          image.sysdir.1=system-images/android-36/google_apis/x86_64/
          showDeviceFrame=no
          fastboot.forceColdBoot=no
          AVDINI
          fi
          {
            echo "=== avd dir ==="
            ls -la "$HOME/.android/avd/"
            echo "=== ini ==="
            cat "$INI"
            echo "=== list-avds ==="
            "${ANDROID_HOME}/emulator/emulator" -list-avds
          } >> "$DBG" 2>&1 || true
          export ANDROID_AVD_HOME="$HOME/.android/avd"

          nohup "${ANDROID_HOME}/emulator/emulator" -avd proof_api36 \
            -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect \
            -no-snapshot -memory 3072 -cores 2 -port 5554 -verbose > "${RUNNER_TEMP}/emulator.log" 2>&1 &
          EMU_OK=0
          for i in $(seq 1 120); do
            if timeout 20 adb devices 2>/dev/null | grep -q "emulator-5554.*device$"; then EMU_OK=1; break; fi
            sleep 5
          done
          if [ "$EMU_OK" != "1" ]; then
            echo "emulator never registered with adb" >&2
            cp "${RUNNER_TEMP}/emulator.log" "${GITHUB_WORKSPACE}/proof-out/diagnostics/" 2>/dev/null || true
            exit 1
          fi
          for i in $(seq 1 120); do
            BC="$(timeout 20 adb -s emulator-5554 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)"
            if [ "$BC" = "1" ]; then echo "boot completed"; break; fi
            sleep 5
          done
          adb devices
          tail -10 "${RUNNER_TEMP}/emulator.log"

      - name: Capture installed-app screenshots
        run: |
          set -euo pipefail
          GATEWAY_TOKEN="$(cat "${RUNNER_TEMP}/gateway-token.txt")"
          export GATEWAY_TOKEN
          export PATH="${ANDROID_HOME}/platform-tools:${ANDROID_HOME}/emulator:${ANDROID_HOME}/cmdline-tools/latest/bin:$PATH"
          adb reverse tcp:18790 tcp:18790
          adb -s emulator-5554 shell settings put global window_animation_scale 0
          adb -s emulator-5554 shell settings put global transition_animation_scale 0
          adb -s emulator-5554 shell settings put global animator_duration_scale 0
          adb -s emulator-5554 shell svc power stayon true
          adb -s emulator-5554 shell wm dismiss-keyguard || true
          python3 proof-tools/capture-installed-app.py \
            --before-apk "${GITHUB_WORKSPACE}/proof-out/before-main.apk" \
            --after-apk "${GITHUB_WORKSPACE}/proof-out/after-head.apk" \
            --out-dir "${GITHUB_WORKSPACE}/proof-out/captures" \
            --gateway-url "ws://127.0.0.1:18790"

      - name: Collect diagnostics
        if: always()
        run: |
          export PATH="${ANDROID_HOME}/platform-tools:${ANDROID_HOME}/emulator:${ANDROID_HOME}/cmdline-tools/latest/bin:$PATH"
          mkdir -p "${GITHUB_WORKSPACE}/proof-out/diagnostics"
          timeout 60 adb -s emulator-5554 logcat -d > "${GITHUB_WORKSPACE}/proof-out/diagnostics/logcat.txt" 2>/dev/null || true
          cp "${RUNNER_TEMP}/gateway.log" "${GITHUB_WORKSPACE}/proof-out/diagnostics/" 2>/dev/null || true
          cp "${RUNNER_TEMP}/emulator.log" "${GITHUB_WORKSPACE}/proof-out/diagnostics/" 2>/dev/null || true
          ls -la "${GITHUB_WORKSPACE}/proof-out/captures" || true

      - name: Upload captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installed-app-proof-captures
          path: proof-out/
          retention-days: 14
          if-no-files-found: warn
